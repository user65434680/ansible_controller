- name: Create AppArmor profiles from whitelist.json
  hosts: all
  become: yes
  vars_files:
    - whitelist.json
  tasks:
  
    - name: Copy AppArmor profiles
      copy:
        dest: "/etc/apparmor.d/usr.bin.{{ item.name }}"
        content: "{{ item.profile }}"
      loop: "{{ whitelist }}"

    - name: Load AppArmor profile
      command: "apparmor_parser -r /etc/apparmor.d/usr.bin.{{ item.name }}"
      loop: "{{ whitelist }}"

    - name: Enforce AppArmor profile
      command: "aa-enforce /etc/apparmor.d/usr.bin.{{ item.name }}"
      loop: "{{ whitelist }}"
