---
- name: Copy all certificates from ./certs on control node to /tmp/certs on remote machine
  hosts: all
  tasks:
    - name: Ensure /tmp/certs directory exists on remote machine
      file:
        path: "/tmp/certs"
        state: directory
        mode: '0755'

    - name: Copy all certificates from control node to remote machine
      copy:
        src: "./certs/"
        dest: "/tmp/certs"
        mode: '0644'