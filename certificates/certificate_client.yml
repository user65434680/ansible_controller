---
- name: Manage certificates on the remote client
  hosts: all
  become: true
  tasks:
    - name: Ensure the custom certificate directory exists
      file:
        path: "/etc/ssl/custom-certs"
        state: directory
        mode: '0755'

    - name: Move certificates from /tmp/certs to the custom directory
      shell: mv /tmp/certs/* /etc/ssl/custom-certs/


    - name: Rehash the certificate directory
      command: c_rehash /etc/ssl/custom-certs

    - name: Combine all certificates into a single PEM file
      shell: cat /etc/ssl/custom-certs/*.crt > /etc/ssl/custom-certs/combined.pem

    - name: Ensure combined PEM file has correct permissions
      file:
        path: "/etc/ssl/custom-certs/combined.pem"
        mode: '0644'

    - name: Print completion message
      debug:
        msg: "Certificate management complete."