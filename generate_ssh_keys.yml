---
- name: Generate SSH key on localhost and distribute to remote hosts
  hosts: all
  gather_facts: false
  vars:
    local_ssh_key_path: /home/controller/.ssh/id_rsa
  tasks:
    - name: Ensure .ssh directory exists on localhost
      delegate_to: localhost
      file:
        path: "{{ local_ssh_key_path | dirname }}"
        state: directory
        mode: '0700'
        owner: controller
        group: controller

    - name: Generate SSH key on localhost if it doesn't exist
      delegate_to: localhost
      openssh_keypair:
        path: "{{ local_ssh_key_path }}"
        type: rsa
        size: 4096
        owner: controller
        group: controller
        mode: '0600'
      register: ssh_keypair_result

    - name: Read public key content from localhost
      delegate_to: localhost
      slurp:
        src: "{{ local_ssh_key_path }}.pub"
      register: public_key_content

    - name: Ensure remote user .ssh directory exists
      file:
        path: "~/.ssh"
        state: directory
        mode: '0700'

    - name: Add public key to authorized_keys
      authorized_key:
        user: "{{ ansible_user | default(ansible_ssh_user) }}"
        key: "{{ public_key_content['content'] | b64decode }}"
