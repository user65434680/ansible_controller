- name: Create low-privileged user with home directory
  hosts: all
  become: yes
  vars_files:
    - user_data.yml
  tasks:
    - name: Ensure the user exists
      ansible.builtin.user:
        name: "{{ item.username }}"
        password: "{{ item.password | password_hash('sha512') }}"
        shell: /bin/bash
        state: present
        create_home: yes
      loop: "{{ users }}"
      loop_control:
        loop_var: item

    - name: Create default directories for each user
      ansible.builtin.file:
        path: "/home/{{ item.0 }}/{{ item.1 }}"
        state: directory
        owner: "{{ item.0 }}"
        group: "{{ item.0 }}"
        mode: '0755'
      loop: "{{ users | product(['Desktop', 'Documents', 'Downloads', 'Music', 'Pictures', 'Videos']) | list }}"
      loop_control:
        loop_var: item