- name: Create low-privileged user with home directory
  hosts: all
  become: yes
  vars_files:
    - user_data.yml
  tasks:
    - name: Ensure the user exists
      ansible.builtin.user:
        name: "{{ item.username }}"
        password: "{{ item.password | password_hash('sha512') }}"
        shell: /bin/bash
        state: present
        create_home: yes
      loop: "{{ users }}"
      loop_control:
        loop_var: item

    - name: Create Desktop directory
      ansible.builtin.file:
        path: "/home/{{ item.username }}/Desktop"
        state: directory
        owner: "{{ item.username }}"
        group: "{{ item.username }}"
        mode: '0755'
      loop: "{{ users }}"
      loop_control:
        loop_var: item

    - name: Create Documents directory
      ansible.builtin.file:
        path: "/home/{{ item.username }}/Documents"
        state: directory
        owner: "{{ item.username }}"
        group: "{{ item.username }}"
        mode: '0755'
      loop: "{{ users }}"
      loop_control:
        loop_var: item

    - name: Create Downloads directory
      ansible.builtin.file:
        path: "/home/{{ item.username }}/Downloads"
        state: directory
        owner: "{{ item.username }}"
        group: "{{ item.username }}"
        mode: '0755'
      loop: "{{ users }}"
      loop_control:
        loop_var: item

    - name: Create Music directory
      ansible.builtin.file:
        path: "/home/{{ item.username }}/Music"
        state: directory
        owner: "{{ item.username }}"
        group: "{{ item.username }}"
        mode: '0755'
      loop: "{{ users }}"
      loop_control:
        loop_var: item

    - name: Create Pictures directory
      ansible.builtin.file:
        path: "/home/{{ item.username }}/Pictures"
        state: directory
        owner: "{{ item.username }}"
        group: "{{ item.username }}"
        mode: '0755'
      loop: "{{ users }}"
      loop_control:
        loop_var: item

    - name: Create Videos directory
      ansible.builtin.file:
        path: "/home/{{ item.username }}/Videos"
        state: directory
        owner: "{{ item.username }}"
        group: "{{ item.username }}"
        mode: '0755'
      loop: "{{ users }}"
      loop_control:
        loop_var: item