---
- name: Remove resolved IP:s, flush dns cache and remove all uncessary blocked IP:s.
  hosts: all
  become: true

  tasks:
    - name: Flush ipset (optional if using ipset)
      command: ipset flush
      ignore_errors: yes

    - name: Flush Unbound DNS cache
      command: unbound-control flush
      ignore_errors: yes

    - name: Restart Unbound service to apply changes
      systemd:
        name: unbound
        state: restarted
        enabled: yes

    - name: Flush IPv4 rules
      ansible.builtin.shell: |
        iptables -F
        iptables -X
        iptables -t nat -F
        iptables -t nat -X
        iptables -t mangle -F
        iptables -t mangle -X

    - name: Flush IPv6 rules and set default policy to DROP
      ansible.builtin.shell: |
        ip6tables -F
        ip6tables -X
        ip6tables -t mangle -F
        ip6tables -t mangle -X
        ip6tables -P INPUT DROP
        ip6tables -P FORWARD DROP
        ip6tables -P OUTPUT DROP