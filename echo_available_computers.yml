---
- name: Count users on each host
  hosts: all
  become: true
  gather_facts: no
  tasks:
    - name: Get users with UID >= 1000
      command: "awk -F: '$3 >= 1000 && $1 != \"nobody\" { print $1 }' /etc/passwd"
      register: user_list

    - name: Set fact with user count
      set_fact:
        user_count: "{{ user_list.stdout_lines | length }}"

- name: Collect user counts and save to JSON
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Create JSON from hostvars
      copy:
        content: |
          {
            {% for host in groups['all'] %}
            "{{ host }}": {{ hostvars[host].user_count | default(0) }}{% if not loop.last %},{% endif %}
            {% endfor %}
          }
        dest: "./user_counts.json"
